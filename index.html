<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>BrowserHax 2.0 - Starter Tests</title>
</head>

<body>
  <h1>BrowserHax 2.0</h1>
  <p>Safe 3DS browser research tests.</p>

  <button onclick="testHTML()">Test HTML Parsing</button>
  <button onclick="testText()">Test Large Text</button>
  <button onclick="testDOM()">Test DOM</button>
  <button onclick="clearTest()">Clear</button>

  <pre id="output">Ready.</pre>
  <div id="test"></div>

<script>
function log(message) {
  document.getElementById("output").textContent += "\n" + message;
}

function testHTML() {
  log("HTML parsing test started.");

  var box = document.getElementById("test");

  box.innerHTML =
    "<div><span><b><i>BrowserHax 2.0</div>" +
    "<p><div><span>Parser test</span>";

  log("HTML test finished.");
}

function testText() {
  log("Large-text test started.");

  var box = document.getElementById("test");
  var text = "";

  for (var i = 0; i < 10000; i++) {
    text += "BrowserHax2.0 ";
  }

  box.textContent = text;

  log("Created 10,000 repeated strings.");
}

function testDOM() {
  log("DOM test started.");

  var box = document.getElementById("test");

  for (var i = 0; i < 500; i++) {
    var element = document.createElement("div");
    element.textContent = "DOM test " + i;
    box.appendChild(element);
  }

  log("Created 500 DOM elements.");
}

function clearTest() {
  document.getElementById("test").innerHTML = "";
  document.getElementById("output").textContent = "Cleared.";
}
</script>

</body>
</html>
